[project]
name = "syfthub-v2-mock"
version = "0.0.1"
description = "UX mock for the SyftHub v2 Python SDK: fluent, client-side fan-out, payment-aware. Fake backends only."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notebook = ["ipywidgets>=8", "ipython>=8", "ipykernel>=6", "nbclient>=0.10", "nbformat>=5", "jupyter-core>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syfthub"]
