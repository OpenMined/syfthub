[project]
name = "syfthub-mcp"
version = "0.1.0"
description = "SyftHub MCP Server with OAuth 2.1 authentication integrated with SyftHub accounts"
requires-python = ">=3.12"
dependencies = [
    # Core MCP framework (CVE-2025-66416, GHSA-rj5c-58rq-j5g5, GHSA-fg6f-75jq-6523).
    # Note: auth extra deprecated in 2.14+, auth features now included by default.
    "fastmcp>=2.14.3",
    "httpx>=0.27.0",
    "starlette>=1.3.1",  # CVE-2025-62727: O(n^2) DoS via Range header
    "pydantic>=2.11.7",
    "cryptography>=48.0.1",
    "pyjwt>=2.13.0",  # CVE-2026-32597: accepts unknown crit header extensions
    "python-dotenv>=1.2.2",  # CVE-2025-67006: symlink following allows arbitrary file overwrite
    "syfthub-sdk",
]

[tool.setuptools]
py-modules = ["server", "syfthub_client"]

[tool.uv.sources]
syfthub-sdk = { path = "../../sdk/python", editable = true }

[tool.uv]
# Floors for packages we do NOT declare above. A constraint intersects with what
# our dependencies require and never adds a package, so it raises a floor without
# deleting an upstream ceiling and costs nothing when the package is absent.
# (An override REPLACES instead -- that is how an unbounded "mcp>=1.23.0" once
# erased fastmcp's "mcp<2.0" and shipped mcp 2.0.0 to prod.)
#
# NOTE: diskcache 5.6.3 (CVE-2025-69872) has no upstream fix; its cache dir is
# hardened in the Dockerfile (chmod 700, syfthub-owned).
constraint-dependencies = [
    # Pulled in transitively.
    "mcp>=1.24.0",  # CVE-2025-66416; ceiling comes from fastmcp
    "authlib>=1.6.12",  # CVE-2025-68158, CVE-2026-27962, CVE-2026-28490, CVE-2026-28498, CVE-2026-28802
    "python-multipart>=0.0.31",
    "email-validator>=2.0.0",
    "Pygments>=2.20.0",  # CVE-2025-68139; via rich
    "requests>=2.32.4",  # CVE-2024-47081; via jsonschema-path (optional from 0.5)
    "urllib3>=2.7.0",  # CVE-2025-66471, CVE-2026-21441, GHSA-pq67-6m6q-mj2v; via requests
    # Left the tree with syft-accounting-sdk. Floors kept so they still apply if
    # anything reintroduces these.
    "aiohttp>=3.14.1",  # CVE-2025-69223
    "werkzeug>=3.1.6",  # CVE-2025-66221, CVE-2026-21860, CVE-2026-27199
]
